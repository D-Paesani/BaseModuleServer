version: '3'

services:
  bms:
    build: ./bms
    container_name: bms
    image: bms_image
    restart: always
    expose:
      - "5002"
    environment:
      - FLASK_CONFIG=${CONFIG}
    volumes:
      - ./bms/controller/logs:/app/bms/controller/logs/
      
  nginx:
    build: ./nginx
    image: bms_nginx_image
    container_name: bms_nginx
    restart: always
    ports:
      - "5002:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/mime.types:/etc/nginx/mime.types
      - ./nginx/run.sh:/etc/nginx/run.sh
      - ./bms/static:/app/static  
    depends_on:
      - bms
